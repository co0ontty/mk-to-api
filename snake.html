<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>贪吃蛇 · Neon Snake</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d31;--line:#28405e;--text:#eaf4ff;--muted:#9bb1c9;--accent:#55e6a5;--food:#ff6b8a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1a3b52,var(--bg) 55%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:flex;justify-content:center;padding:clamp(16px,4vw,40px)}main{width:min(680px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}h1{font-size:clamp(28px,7vw,44px);margin:0;letter-spacing:.04em}p{color:var(--muted);margin:.3rem 0 0}.scores{display:flex;gap:10px}.score{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 15px;text-align:center;min-width:80px}.score b{display:block;font-size:24px;color:var(--accent)}.score small{color:var(--muted)}.board-wrap{position:relative;background:#091626;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 20px 60px #0005}.board{display:block;width:100%;aspect-ratio:1;border-radius:12px;background:#0a1727;touch-action:none}.overlay{position:absolute;inset:10px;display:grid;place-items:center;text-align:center;background:#07111fbb;border-radius:12px;padding:25px}.overlay[hidden]{display:none}.overlay h2{font-size:30px;margin:0 0 8px}.overlay p{max-width:300px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{font:inherit;font-weight:700;color:var(--text);background:#172a43;border:1px solid #345274;border-radius:12px;padding:12px 18px;cursor:pointer;transition:.2s}button:hover,button:focus-visible{border-color:var(--accent);transform:translateY(-1px)}button.primary{background:var(--accent);color:#062019;border-color:var(--accent)}.hint{font-size:14px;text-align:center}.pad{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:7px;margin:18px auto 0}.pad button{padding:14px 0;font-size:20px}.pad .empty{visibility:hidden}@media(min-width:600px){.pad{display:none}}
</style></head>
<body><main><header><div><h1>贪吃蛇</h1><p id="status" aria-live="polite">准备开始</p></div><div class="scores"><div class="score"><b id="score">0</b><small>得分</small></div><div class="score"><b id="best">0</b><small>最高分</small></div></div></header><section class="board-wrap"><canvas id="board" class="board" aria-label="贪吃蛇游戏区域" role="application" tabindex="0"></canvas><div class="overlay" id="overlay"><div><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">使用方向键、WASD 或滑动控制蛇移动。</p><button class="primary" id="overlayBtn">开始游戏</button></div></div></section><div class="actions"><button class="primary" id="start">开始</button><button id="pause">暂停</button><button id="restart">重新开始</button></div><div class="pad" aria-label="触摸方向控制"><span class="empty"></span><button data-dir="up" aria-label="向上">↑</button><span class="empty"></span><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div><p class="hint">方向键 / WASD 控制 · 空格暂停 · 手机可滑动</p></main>
<script>
(() => {"use strict";
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),statusEl=document.querySelector('#status'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),overlayTitle=document.querySelector('#overlayTitle'),overlayText=document.querySelector('#overlayText'),overlayBtn=document.querySelector('#overlayBtn');
const N=20; let snake,food,dir,nextDir,running=false,paused=false,score=0,timer=0,last=0,cell=0,touchStart=null; let best=Number(localStorage.getItem('snake-best')||0); bestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);cell=r.width/N;draw()} function randomFood(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});return free.length?free[Math.floor(Math.random()*free.length)]:null}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};food=randomFood();score=0;scoreEl.textContent=0;paused=false;running=false;cancelAnimationFrame(timer);draw()}
function show(title,text,button='开始游戏'){overlayTitle.textContent=title;overlayText.textContent=text;overlayBtn.textContent=button;overlay.hidden=false} function start(){if(!snake)reset();running=true;paused=false;overlay.hidden=true;statusEl.textContent='游戏进行中';last=performance.now();timer=requestAnimationFrame(loop);canvas.focus()} function pause(){if(!running)return;paused=!paused;statusEl.textContent=paused?'已暂停':'游戏进行中';if(!paused){last=performance.now();timer=requestAnimationFrame(loop)}}
function end(){running=false;cancelAnimationFrame(timer);if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=best}statusEl.textContent='游戏结束';show('游戏结束',`得分 ${score} · 再来一局？`,'重新开始')}
function setDir(x,y){if(!running||paused)return;if(x===-dir.x&&y===-dir.y)return;nextDir={x,y}}
function loop(now){if(!running||paused)return;if(now-last>=Math.max(65,180-score*4)){last=now;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},hit=head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some((s,i)=>i>0&&s.x===head.x&&s.y===head.y);if(hit){end();draw();return}snake.unshift(head);if(food&&head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;food=randomFood()}else snake.pop();draw()}timer=requestAnimationFrame(loop)}
function draw(){const w=canvas.clientWidth;ctx.clearRect(0,0,w,w);ctx.strokeStyle='#10263c';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,w);ctx.moveTo(0,i*cell);ctx.lineTo(w,i*cell);ctx.stroke()}if(food){ctx.fillStyle='#ff6b8a';ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.32,0,Math.PI*2);ctx.fill()}snake.forEach((s,i)=>{ctx.fillStyle=i?'#36bd88':'#75f0b5';ctx.beginPath();ctx.roundRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4,cell*.25);ctx.fill()})}
function key(e){const k=e.key.toLowerCase();if(k===' '){e.preventDefault();pause();return}const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m){e.preventDefault();setDir(...m)}}
canvas.addEventListener('keydown',key);document.addEventListener('keydown',key);document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=()=>{reset();start()};overlayBtn.onclick=()=>{if(running)reset();start()};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];setDir(...d)});canvas.addEventListener('pointerdown',e=>touchStart={x:e.clientX,y:e.clientY});canvas.addEventListener('pointerup',e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0);touchStart=null});window.addEventListener('resize',resize);reset();resize();
})();
</script></body></html>
